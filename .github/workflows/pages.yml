name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test before deployment
        run: npm test
      - name: Install pinned test-only dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1 three@0.185.1
      - name: Chromium integration with mocked rankings
        run: node tools/browser-smoke.cjs
      - name: WebKit integration with mocked rankings
        run: BROWSER_ENGINE=webkit node tools/browser-smoke.cjs

      - name: Prepare validated runtime files only
        run: |
          mkdir site
          cp index.html styles.css site/
          cp -R src site/
          touch site/.nojekyll
      - name: Upload validated commit artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject superseded revision
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          test "$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh api repos/${{ github.repository }}/pages --jq .build_type)" = "workflow"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
