name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test before deployment
        run: npm test
      - name: Install pinned test-only dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1 three@0.185.1
      - name: Chromium integration with mocked rankings
        run: node tools/browser-smoke.cjs
      - name: WebKit integration with mocked rankings
        run: BROWSER_ENGINE=webkit node tools/browser-smoke.cjs

      - name: Prepare validated runtime files only
        run: |
          mkdir site
          cp index.html styles.css site/
          cp -R src assets site/
          touch site/.nojekyll
      - name: Upload validated commit artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject superseded revision
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          # Never print API bodies or raw gh diagnostics in the workflow log.
          api_error="$(mktemp)"
          trap 'rm -f -- "$api_error"' EXIT
          report_api_error() {
            local api="$1"
            if grep -Eq '^gh: .* \(HTTP (401|403)\)$' "$api_error"; then
              printf '::error::%s API: authorization failed (HTTP 401/403).\n' "$api"
            elif grep -Eq '^gh: .* \(HTTP 404\)$' "$api_error"; then
              printf '::error::%s API: not found or inaccessible (HTTP 404).\n' "$api"
            else
              printf '::error::%s API: request failed.\n' "$api"
            fi
          }

          if ! current_sha="$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha 2>"$api_error")"; then
            report_api_error Ref
            exit 1
          fi
          if ! [[ "$current_sha" =~ ^[0-9a-f]{40}$ && "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Ref gate: missing or invalid SHA.'
            exit 1
          fi
          if [[ "$current_sha" != "$TARGET_SHA" ]]; then
            echo '::error::Ref gate: superseded revision.'
            exit 1
          fi

          if ! source="$(gh api repos/${{ github.repository }}/pages --jq 'if .build_type == null then empty else .build_type end' 2>"$api_error")"; then
            report_api_error Pages
            exit 1
          fi
          case "$source" in
            workflow) ;;
            legacy) echo '::error::Pages gate: legacy publishing source.'; exit 1 ;;
            '') echo '::error::Pages gate: missing publishing source.'; exit 1 ;;
            *) echo '::error::Pages gate: unsupported publishing source.'; exit 1 ;;
          esac
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
