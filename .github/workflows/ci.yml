name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - work/goriragouu-share-acceptance-20261102

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test rules and source syntax
        run: npm test
      - name: Install pinned test-only dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1 three@0.185.1
      - name: Chromium integration with mocked rankings
        run: node tools/browser-smoke.cjs
      - name: WebKit integration with mocked rankings
        run: BROWSER_ENGINE=webkit node tools/browser-smoke.cjs
      - name: Preserve isolated share screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: share-acceptance-${{ github.sha }}
          path: test-artifacts/share/*.png
          if-no-files-found: warn
          retention-days: 7
